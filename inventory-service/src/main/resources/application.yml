server:
  port: 8092


spring:

  data:
    mongodb:
      database: admin
      uri: ${MONGO_DB_URI:mongodb://admin:12345@localhost:27017}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_HOST:5438}/${DB_NAME:inventory-db}
    username: ${DB_USER:postgres}
    password:  ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    topic:
      orchestrator: orchestrator
      inventory-validation-success: inventory-validation-success
      inventory-validation-fail: inventory-validation-fail

    consumer:
      group-id: inventory-group
      auto-offset-reset: latest  

logging:
  level:
    org:
      apache:
        kafka: OFF
